# fly.toml app configuration file generated for pia-hidden-haze-4185 on 2026-09-17T10:40:27-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pia-hidden-haze-4185'
primary_region = 'gru'

[build]
[env]
  CORS_ORIGIN = '*'
  GALERIA_DIR = '/data/galeria'
  GEMINI_IMAGE_MODEL = 'gemini-3-pro-image-preview'
  PORT = '8080'
  COOLDOWN_IP_S = '5'
  GEMINI_CONCURRENCY = '4'
  LIMITE_GLOBAL_HORA = '300'

# Disco persistente do mural. Sem isto a pasta vive no filesystem da máquina, que é
# efêmero: some a cada deploy e a cada restart.
# Criar uma vez com:  fly volumes create pia_dados --region gru --size 3
[mounts]
  source = 'pia_dados'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 40
    soft_limit = 20

# performance-2x para o evento de 25 pessoas: CPU dedicada absorve o pico do sharp
# (dois encodes JPEG por geração) com 13 simultâneas. Depois do evento dá para voltar
# para shared-cpu-1x e economizar.
[[vm]]
  size = 'performance-2x'
  memory = '4gb'
