# fly.toml app configuration file generated for pia-hidden-haze-4185 on 2026-09-17T10:40:27-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pia-hidden-haze-4185'
primary_region = 'gru'

[build]
[env]
  CORS_ORIGIN = '*'
  GEMINI_IMAGE_MODEL = 'gemini-3-pro-image-preview'
  PORT = '8080'
  RATE_LIMIT_PER_HOUR = '30'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 40
    soft_limit = 20

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
